<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="You are warmly invited to celebrate the wedding of Suraj &amp; Jyoti · 22–24 November 2026 · Gurgaon">
<meta name="theme-color" content="#2a070d">
<meta property="og:type" content="website">
<meta property="og:url" content="https://surajdahman11-pro.github.io/SurajJyotiWedding/">
<meta property="og:title" content="Suraj &amp; Jyoti — Wedding Invitation">
<meta property="og:description" content="You are warmly invited · Haldi, Mehndi &amp; Sangeet 22 Nov · Lagan 23 Nov · Baraat 24 Nov 2026, Gurgaon">
<meta property="og:image" content="https://surajdahman11-pro.github.io/SurajJyotiWedding/preview.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<title>Suraj &amp; Jyoti — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Amita:wght@400;700&family=Dancing+Script:wght@500;600&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#4a1018; --wine2:#6b2a2c; --ink:#3d0c14; --gold:#b8875a; --gold2:#d9b47e;
    --cream:#f4e8d2; --cream2:#e3cfac;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#120306;overflow:hidden;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}
  #stage *{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  #stage{position:absolute;left:50%;top:50%;width:450px;height:800px;transform-origin:50% 50%;
    overflow:hidden;background:#2a070d;user-select:none;-webkit-user-select:none;cursor:pointer}

  /* ---------- background ---------- */
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 70% 45% at 50% 42%, rgba(120,30,40,.55), transparent 70%),
      radial-gradient(ellipse at 20% 100%, #3a0a12, transparent 60%),
      linear-gradient(180deg,#34080f 0%,#2a060c 55%,#1c0408 100%);}
  .bg svg{position:absolute;inset:0;width:100%;height:100%}
  .world{position:absolute;inset:0;transform:scale(1.5);transform-origin:50% 46%;transition:transform 4.4s cubic-bezier(.45,.05,.15,1)}
  .opened .world{transform:scale(1)}

  .glow{position:absolute;left:50%;top:46%;width:520px;height:720px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,214,150,.55), rgba(255,190,120,.15) 40%, transparent 68%);
    opacity:0;transition:opacity 1.6s ease;pointer-events:none;mix-blend-mode:screen}
  .opening .glow{opacity:1}
  .opened .glow{opacity:.28;transition:opacity 3s ease}

  /* ---------- 3D card ---------- */
  .persp{position:absolute;inset:0;perspective:1300px;perspective-origin:50% 45%}
  .cardWrap{position:absolute;left:45px;top:132px;width:360px;height:560px;transform-style:preserve-3d}
  .tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s ease-out}
  .sway{position:absolute;inset:0;transform-style:preserve-3d;animation:sway 9s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotateY(-2.4deg) rotateX(1deg)}50%{transform:rotateY(2.4deg) rotateX(-1deg)}}
  .card{position:absolute;inset:0;filter:drop-shadow(0 22px 28px rgba(0,0,0,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .card svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
    clip-path:url(#archClip);
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);
    background-size:300% 100%;animation:sheen 7s ease-in-out infinite}
  @keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}

  .content{position:absolute;left:30px;right:30px;top:70px;bottom:36px;transform:translateZ(14px);color:var(--ink)}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    opacity:1;transition:opacity .9s ease, filter .9s ease, transform .9s ease;pointer-events:none}
  .scene.off{opacity:0;filter:blur(8px);transform:translateY(-10px)}
  .r{opacity:0;transform:translateY(14px);filter:blur(7px);
     transition:opacity 1.1s ease var(--d,0s), transform 1.3s cubic-bezier(.2,.7,.2,1) var(--d,0s), filter 1.1s ease var(--d,0s)}
  .scene.on .r{opacity:1;transform:none;filter:blur(0)}
  .w{clip-path:inset(-20% 100% -20% 0);opacity:.2;
     transition:clip-path 1.9s cubic-bezier(.5,.1,.3,1) var(--d,0s), opacity .6s ease var(--d,0s)}
  .scene.on .w{clip-path:inset(-20% -20% -20% -10%);opacity:1}

  .arabic{font-family:'Amiri',serif;font-size:27px;font-weight:700;color:var(--wine);line-height:1.5;direction:rtl}
  .caps{font-family:'Cinzel',serif;letter-spacing:.5em;font-size:10.5px;color:var(--wine2);padding-left:.5em}
  .bigcaps{font-family:'Cinzel',serif;font-size:33px;letter-spacing:.06em;color:var(--wine);line-height:1.1}
  .script{font-family:'Great Vibes',cursive;color:var(--wine);line-height:1.05}
  .serif{font-family:'Cormorant Garamond',serif;color:var(--wine2)}
  .it{font-style:italic}
  .b{font-weight:700;color:var(--wine)}
  .divider{width:150px;height:16px;margin:8px auto}


  .ganesh{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--wine);margin-top:4px}
  .evList{display:flex;flex-direction:column;gap:6px;width:100%;max-width:268px;margin:2px auto 0}
  .evRow{display:grid;grid-template-columns:66px 1px 1fr;align-items:center;column-gap:12px;text-align:left}
  .evTime{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.06em;color:var(--wine2);text-align:right;white-space:nowrap}
  .evBar{height:30px;background:var(--gold);opacity:.7}
  .evName{font-family:'Great Vibes',cursive;font-size:31px;line-height:1;color:var(--wine)}
  .evNote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;color:var(--wine2);margin-top:1px}
  .dateRow{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 6px}
  .dnum{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:66px;line-height:.9;color:var(--wine)}
  .dbar{width:1px;height:56px;background:var(--gold)}
  .dside{text-align:left;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.2;color:var(--wine2)}

  .mono{position:relative;width:250px;height:190px}
  .mono .mletters{position:absolute;left:0;right:0;top:-4px;display:flex;justify-content:center;align-items:flex-start;
    font-family:'Great Vibes',cursive;font-size:168px;line-height:1.05;color:var(--wine)}
  .mono .m2{margin-left:-.12em;transform:translateY(.07em)}
  .mono svg{position:absolute;left:0;top:0;width:250px;height:190px;overflow:visible}
  .draw path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 2.6s cubic-bezier(.5,.1,.3,1) var(--d,0s)}
  .scene.on .draw path{stroke-dashoffset:0}

  /* ---------- doors ---------- */
  .doors{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 50%;z-index:20;pointer-events:none}
  .door{position:absolute;top:0;width:225px;height:800px;transform-style:preserve-3d;
        transition:transform 2.7s cubic-bezier(.6,0,.3,1)}
  .door .face{position:absolute;inset:0;backface-visibility:hidden;transition:filter 2.7s ease}
  .door.dl{left:0;transform-origin:0 50%;z-index:2}
  .door.dr{right:0;transform-origin:100% 50%;z-index:1}
  .opening .door.dl{transform:rotateY(-98deg)}
  .opening .door.dr{transform:rotateY(98deg)}
  .opening .door .face{filter:brightness(.6)}
  .door svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .edge{position:absolute;top:0;height:100%;width:16px;
        background:linear-gradient(90deg,#5e3d20,#e6c48a 35%,#b8875a 60%,#6b4626)}
  .door.dl .edge{left:225px;transform-origin:0 50%;transform:rotateY(90deg)}
  .door.dr .edge{left:-16px;transform-origin:100% 50%;transform:rotateY(-90deg)}
  .doors.gone{display:none}

  .hint{position:absolute;left:0;right:0;bottom:92px;text-align:center;z-index:30;font-family:'Cinzel',serif;
        color:var(--gold2);letter-spacing:.4em;font-size:12px;padding-left:.4em;animation:pulse 2.2s ease-in-out infinite;transition:opacity .6s}
  .hint small{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.05em;font-size:15px;margin-top:6px;color:#e9cfa6}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .opening .hint{opacity:0;animation:none}
  .hint{display:none}
  .needTap .hint{display:block}

  /* ---------- foreground florals, petals ---------- */
  .fg{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity 1.6s ease .6s}
  .opened .fg{opacity:1}
  .fg svg{position:absolute;inset:0;width:100%;height:100%}
  .petals{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
  .petal{position:absolute;top:-40px;animation:fall linear forwards}
  .petal i{display:block;width:12px;height:16px;border-radius:70% 0 70% 0;
           background:radial-gradient(circle at 30% 30%,#c4505e,#7e1a2a 70%);animation:flutter ease-in-out infinite alternate;opacity:.9}
  .petal.g i{width:5px;height:5px;border-radius:50%;background:#f1d29a;box-shadow:0 0 8px 2px rgba(241,210,154,.7)}
  @keyframes fall{to{transform:translate3d(var(--dx),880px,0) rotate(var(--rot))}}
  @keyframes flutter{from{transform:rotateX(0) rotateY(0) translateX(-8px)}to{transform:rotateX(70deg) rotateY(160deg) translateX(10px)}}

  .replay{position:absolute;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px);z-index:40;
          font-family:'Cinzel',serif;letter-spacing:.25em;font-size:11px;color:var(--gold2);background:rgba(40,6,12,.55);
          border:1px solid rgba(217,180,126,.6);padding:12px 22px 12px 26px;border-radius:999px;min-height:44px;cursor:pointer;
          opacity:0;pointer-events:none;transition:opacity .8s, transform .8s}
  .replay.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){.sway,.sheen{animation:none}}

  /* ---------- music ---------- */
  .musicBtn{position:absolute;top:16px;right:16px;z-index:45;width:44px;height:44px;border-radius:50%;cursor:pointer;
    background:rgba(30,4,9,.6);border:1px solid rgba(217,180,126,.7);color:#e8c891;display:grid;place-items:center;padding:0;
    box-shadow:0 0 0 0 rgba(217,180,126,.5);animation:ring 2s ease-out infinite}
  .musicBtn.playing{animation:none}
  .musicBtn svg{width:20px;height:20px}
  .musicBtn .bars{display:none}.musicBtn.playing .bars{display:block}.musicBtn.playing .note{display:none}
  .bars rect{transform-origin:50% 100%;transform-box:fill-box;animation:eq 1s ease-in-out infinite alternate}
  .bars rect:nth-child(2){animation-delay:-.4s}.bars rect:nth-child(3){animation-delay:-.7s}
  @keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,180,126,.55)}100%{box-shadow:0 0 0 14px rgba(217,180,126,0)}}
  .musicTip{position:absolute;top:28px;right:68px;z-index:45;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;
    color:#f0d7a8;background:rgba(30,4,9,.55);padding:4px 10px;border-radius:999px;pointer-events:none;transition:opacity .8s}
  .musicTip.hide{opacity:0}

  /* ---------- scene artwork ---------- */
  .scene > *:not(.wm){position:relative;z-index:1}
  .wm{position:absolute;inset:-40px -24px -24px;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease .3s}
  .scene.on .wm{opacity:1}
  .wm svg{width:100%;height:100%}
  .wm.bandhani{-webkit-mask-image:radial-gradient(ellipse 62% 55% at 50% 52%,rgba(0,0,0,.08) 35%,#000 80%);mask-image:radial-gradient(ellipse 62% 55% at 50% 52%,rgba(0,0,0,.08) 35%,#000 80%)}
  #pomWM{transition:opacity 1.2s ease}
  .wm .rg{transform-box:fill-box;transform-origin:center;opacity:0}
  .scene.on .wm .rg{animation:bloom .9s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes bloom{from{opacity:0;scale:.2;rotate:-60deg}to{opacity:1;scale:1;rotate:0deg}}
  .ownWM #pomWM{opacity:0}
  .mono .mandala{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-132px 0 0 -125px;z-index:0;opacity:.5;animation:spin 70s linear infinite}
  .mono .mletters,.mono .draw{z-index:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toran .tl{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.6s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  @media (prefers-reduced-motion:reduce){.mandala,.toran .tl{animation:none}}

  /* ---------- language, music label, countdown ---------- */
  .langBtn{position:absolute;top:84px;right:16px;z-index:45;height:40px;padding:0 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:rgba(30,4,9,.72);border:1px solid rgba(217,180,126,.75);color:#fbe6bd;box-shadow:0 2px 10px rgba(0,0,0,.35);
    font-family:'Kalam',cursive;font-size:16px;font-weight:700;line-height:1}
  .musicLabel{position:absolute;top:22px;right:68px;z-index:45;cursor:pointer;white-space:nowrap;
    font-family:'Cormorant Garamond',serif;font-weight:600;font-style:italic;font-size:16px;color:#fbe6bd;
    background:rgba(30,4,9,.72);border:1px solid rgba(217,180,126,.75);border-radius:999px;padding:6px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.35);animation:labelPulse 2.4s ease-in-out infinite;transition:opacity .6s}
  .musicOn .musicLabel{display:none}
  .musicCap{display:none;position:absolute;top:61px;right:10px;width:56px;text-align:center;z-index:45;pointer-events:none;
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:12px;letter-spacing:.08em;color:#e8cfa0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .musicOn .musicCap{display:block}
  .hi .musicCap{font-family:'Kalam',cursive;letter-spacing:0;font-size:11.5px}
  @keyframes labelPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .scene.on:not(.off) a{pointer-events:auto}
  .dirLink{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 14px;min-height:36px;border-radius:999px;
    border:1px solid #b8875a;color:var(--wine);text-decoration:none;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15px;background:rgba(255,248,235,.6)}
  .dirLink svg,.cta svg{width:16px;height:16px;flex:none}
  .cd{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}
  .cdBox{width:60px;padding:8px 0 6px;border:1px solid #c99a5a;border-radius:8px;background:rgba(255,248,235,.55);text-align:center}
  .cdNum{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;line-height:1;color:var(--wine)}
  .cdUnit{font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.12em;color:var(--wine2);margin-top:3px}
  .cdMsg{font-family:'Great Vibes',cursive;font-size:30px;color:var(--wine)}
  .cdMsg:empty{display:none}
  .ctas{display:flex;flex-direction:column;gap:8px;margin-top:12px;width:100%;max-width:272px}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:999px;text-decoration:none;
    background:var(--wine);color:#fbe6bd;font-family:'Dancing Script',cursive;font-weight:600;font-size:18px;line-height:1;white-space:nowrap;padding:0 14px;border:1px solid #d9b47e;
    box-shadow:0 2px 6px rgba(74,16,24,.25)}
  /* Hindi: cursive Devanagari fonts */
  .hi .script,.hi .evName,.hi .mletters,.hi .bigcaps,.hi .cdMsg{font-family:'Amita',cursive}
  .hi .cta{font-family:'Amita',cursive;font-size:16px}
  .hi .serif,.hi .caps,.hi .evTime,.hi .evNote,.hi .dside,.hi .ganesh,.hi .hint,.hi .hint small,.hi .cdUnit,.hi .dirLink,.hi .musicLabel,.hi .replay{font-family:'Kalam',cursive;font-style:normal}
  .hi .caps,.hi .hint,.hi .cdUnit,.hi .replay{letter-spacing:.04em !important}
  .hi .caps{font-size:13px}
  .hi .bigcaps{font-size:38px;letter-spacing:0}
  .hi .evName{font-size:27px;line-height:1.15}
  .hi .evRow{grid-template-columns:74px 1px 1fr;column-gap:10px}
  .hi .evTime{font-size:12.5px}
  .hi .evList{max-width:236px}
  .hi .script{line-height:1.25}
  .hi .mletters{font-size:130px;line-height:1.3}
  .hi .mono .m2{margin-left:.04em;transform:translateY(.06em)}
  .hi .musicLabel{font-size:14px}
  .ganeshArt{width:228px;height:362px}
  .ganeshArt svg{width:100%;height:100%;overflow:visible}
  .gRv{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset var(--t,1s) cubic-bezier(.45,.05,.3,1) var(--d,0s)}
  .scene.on .gRv{stroke-dashoffset:0}
  .gPop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:opacity .7s ease var(--d,0s),transform .9s cubic-bezier(.3,1.6,.5,1) var(--d,0s)}
  .scene.on .gPop{opacity:1;transform:none}
  .gGl{mix-blend-mode:soft-light}
  /* ---------- couple ---------- */
  .couple{position:absolute;left:0;top:0;width:200px;height:260px;z-index:9;pointer-events:none;transform-origin:0 0;
    opacity:0;transform:translate(125px,590px) scale(1);transition:transform 1.8s cubic-bezier(.4,.1,.2,1), opacity 1.2s ease}
  .couple.center{opacity:1;transform:translate(125px,532px) scale(1)}
  .couple.corner{opacity:1;transform:translate(318px,644px) scale(.6)}
  .couple svg{width:100%;height:100%;overflow:visible;animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .couple .bride{transform-origin:68px 252px;animation:lean 5.2s ease-in-out infinite}
  .couple .groom{transform-origin:138px 252px;animation:lean 6s ease-in-out infinite reverse}
  @keyframes lean{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
  .couple .dupatta{transform-origin:68px 40px;animation:wave 3.4s ease-in-out infinite alternate}
  .couple .tail{transform-origin:138px 46px;animation:wave 2.8s ease-in-out infinite alternate}
  @keyframes wave{from{transform:skewX(-2.5deg) scaleX(.99)}to{transform:skewX(3.5deg) scaleX(1.04)}}
  @media (prefers-reduced-motion:reduce){.couple svg,.couple .bride,.couple .groom,.couple .dupatta,.couple .tail{animation:none}}

</style>
</head>
<body>
<!-- shared defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="pA" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#6e2630"/><stop offset=".65" stop-color="#3e0d16"/><stop offset="1" stop-color="#22050a"/></radialGradient>
    <radialGradient id="pB" cx="50%" cy="85%" r="80%"><stop offset="0" stop-color="#7f3038"/><stop offset=".7" stop-color="#4e1520"/><stop offset="1" stop-color="#2c070e"/></radialGradient>
    <radialGradient id="pC" cx="50%" cy="85%" r="80%"><stop offset="0" stop-color="#94464a"/><stop offset=".7" stop-color="#5e2028"/><stop offset="1" stop-color="#360a12"/></radialGradient>
    <linearGradient id="cuG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a4a44"/><stop offset=".55" stop-color="#622428"/><stop offset="1" stop-color="#3e1216"/></linearGradient>
    <linearGradient id="cuL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8645a"/><stop offset=".6" stop-color="#7a3232"/><stop offset="1" stop-color="#4e1a1e"/></linearGradient>
    <radialGradient id="enamel" cx="42%" cy="35%" r="75%"><stop offset="0" stop-color="#7a1a26"/><stop offset=".6" stop-color="#4a0a14"/><stop offset="1" stop-color="#22040a"/></radialGradient>
    <linearGradient id="doorG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f0509"/><stop offset=".6" stop-color="#2c0910"/><stop offset="1" stop-color="#23060b"/></linearGradient>
    <pattern id="stripe" width="3.2" height="10" patternUnits="userSpaceOnUse"><rect width="1.4" height="10" fill="#000" opacity=".28"/><rect x="1.6" width=".6" height="10" fill="#5a1c22" opacity=".18"/></pattern>
    <filter id="emb" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
      <feSpecularLighting in="b" surfaceScale="2.6" specularConstant=".95" specularExponent="15" lighting-color="#ffd9ae" result="sp"><feDistantLight azimuth="235" elevation="40"/></feSpecularLighting>

function peony(x,y,r,rot=0){
  const P=(R,w)=>`M0,0 C${R*w},${-R*.12} ${R*(w+.12)},${-R*.82} ${R*.32},${-R*.98} Q${R*.16},${-R*1.06} 0,${-R*.94} Q${-R*.16},${-R*1.06} ${-R*.32},${-R*.98} C${-R*(w+.12)},${-R*.82} ${-R*w},${-R*.12} 0,0Z`;
  const stitches=(R,n)=>{let d='';for(let k=0;k<n;k++){const t=(k/(n-1)-.5)*1.2; d+=`M${t*R*.12},${-R*.12} Q${t*R*.42},${-R*.55} ${t*R*.5},${-R*.9} `;} return d;};
  const ring=(R,w,n,off,fill,col)=>{let g='';for(let i=0;i<n;i++){const t=`rotate(${i*360/n+off})`;
    g+=`<path d="${P(R,w)}" transform="${t}" fill="${fill}" stroke="#1a0306" stroke-width=".6"/>
        <path d="${stitches(R,7)}" transform="${t}" fill="none" stroke="${col}" stroke-width=".42" opacity=".55"/>
        <path d="${P(R,w)}" transform="${t}" fill="none" stroke="#d9b47e" stroke-width=".75" stroke-dasharray="1.3 1.1" opacity=".85"/>`;} return g;};
  let g=`<g transform="translate(${x} ${y}) rotate(${rot})">`;
  g+=ring(r,.52,11,0,'url(#peoA)','#9a4450');
  g+=ring(r*.76,.5,9,17,'url(#peoB)','#b0585e');
  g+=ring(r*.54,.46,7,6,'url(#peoB)','#c06a6a');
  g+=ring(r*.34,.5,5,30,'url(#peoA)','#c06a6a');
  g+=`<circle r="${r*.14}" fill="#2a0509" stroke="#d9b47e" stroke-width=".9"/>`;
  for(let i=0;i<14;i++){const a=i*Math.PI/7, rr=r*(.16+(i%2)*.07); g+=`<line x1="0" y1="0" x2="${Math.cos(a)*rr}" y2="${Math.sin(a)*rr}" stroke="#d9b47e" stroke-width=".6"/><circle cx="${Math.cos(a)*rr}" cy="${Math.sin(a)*rr}" r="${r*.028+.8}" fill="url(#seq)"/>`;}
  return g+`</g>`;
}

}


/* toran: mango leaves and marigolds hanging along the arch */
(function(){
  const line = document.getElementById('toranLine'), L = line.getTotalLength(), n = 19; let g = '';
  for(let i=0;i<n;i++){
    const pt = line.getPointAtLength(L*(i+.5)/n), d = (i*.23)%1.4;
    if(i%2===0){
      g += `<g class="tl" style="animation-delay:-${d}s"><path transform="translate(${pt.x} ${pt.y})" d="M0,0 C5,4 5.5,13 0,20 C-5.5,13 -5,4 0,0Z" fill="#4f6b34" stroke="#c9a46a" stroke-width=".6"/>
            <path transform="translate(${pt.x} ${pt.y})" d="M0,2 L0,18" stroke="#9ab070" stroke-width=".5"/></g>`;
    } else {
      let m=''; for(let k=0;k<10;k++){ const a=k*Math.PI/5; m+=`<circle cx="${(Math.cos(a)*3.2).toFixed(2)}" cy="${(Math.sin(a)*3.2+6).toFixed(2)}" r="2.3" fill="${k%2?'#e39a2e':'#f0b33c'}"/>`; }
      g += `<g class="tl" style="animation-delay:-${d}s"><g transform="translate(${pt.x} ${pt.y})"><path d="M0,0 L0,2" stroke="#8a5a3a" stroke-width=".8"/>${m}<circle cx="0" cy="6" r="1.6" fill="#b5651d"/></g></g>`;
    }
  }
  document.getElementById('toran').innerHTML = g;
})();

const calIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
function buildScenes(){
  const S = [];
  // 0 Shree Ganesh
  S.push(`<div class="ganeshArt r" style="--d:.1s">${ganeshSVG()}</div>
    <div class="ganesh r" style="--d:2.6s;font-size:21px;margin-top:8px;white-space:nowrap">${esc(C.ganesh)}</div>
    ${divider(1.5)}`);
  // 1 monogram
  S.push(`${monogram(1,.1)}${divider(1.4)}`);
  // 2 title + names
  S.push(`
    ${lotus(.1,1.2)}
    <div class="ganesh r" style="--d:.4s">${esc(C.ganesh)}</div>
    ${divider(.7)}
    <div class="caps r" style="--d:1s;margin-top:14px">${U.wedding}</div>
    <div class="bigcaps r" style="--d:1.3s;margin-top:6px">${U.invitation}</div>
    <div class="script w" style="--d:2s;font-size:50px;margin-top:22px">${esc(C.groom)} ${U.amp} ${esc(C.bride)}</div>`);
  // 3 family invitation
  S.push(`
    <div class="ganesh r" style="--d:0s;font-size:15px">${esc(C.ganesh)}</div>
    <div class="serif it r" style="--d:.4s;font-size:15px;line-height:1.25;margin-top:6px">${esc(C.invocation[0])}<br>${esc(C.invocation[1])}</div>
    <div class="serif b r" style="--d:1s;font-size:18px;margin-top:12px">${esc(C.groomParents)}</div>
    <div class="serif r" style="--d:1.4s;font-size:16px;line-height:1.22;margin-top:4px">${U.request[0]}<br>${U.request[1]}${C.groomRelation?'<br>'+esc(C.groomRelation):''}</div>
    <div class="script w" style="--d:2.2s;font-size:54px;margin-top:10px">${esc(C.groom)}</div>
    <div class="script r" style="--d:3.2s;font-size:28px;color:#6b2a2c">${U.withWord}</div>
    <div class="script w" style="--d:3.6s;font-size:54px">${esc(C.bride)}</div>
    ${C.brideParents?`<div class="serif r" style="--d:4.6s;font-size:14.5px;margin-top:6px;line-height:1.25">${esc(C.brideParents)}</div>`:''}`);
  // day-by-day schedule
  for (const d of C.days){
    const rows = d.events.map((e,i)=>`
        <div class="evRow r" style="--d:${1.5+i*.45}s">
          <div class="evTime">${esc(e.time)}</div><div class="evBar"></div>
          <div class="evMain"><div class="evName">${esc(e.name)}</div>${e.note?`<div class="evNote">${esc(e.note)}</div>`:''}</div>
        </div>`).join('');
    const after = 1.5 + d.events.length*.45;
    S.push(`${wmFor(d.art)}
      <div class="caps r" style="--d:.1s;letter-spacing:.42em">${esc(d.label)}</div>
      <div class="dateRow r" style="--d:.5s;margin-top:4px">
        <div class="dnum">${esc(d.day)}</div><div class="dbar"></div>
        <div class="dside">${esc(d.weekday)}<br>${esc(d.monthYear)}</div>
      </div>
      ${divider(1.1)}
      <div class="evList">${rows}</div>
      ${d.venue?`${divider(after+.2)}
      <div class="caps r" style="--d:${after+.4}s;letter-spacing:.35em">${U.venue}</div>
      <div class="serif b r" style="--d:${after+.6}s;font-size:18px;margin-top:2px">${esc(d.venue)}</div>
      <div class="serif it r" style="--d:${after+.8}s;font-size:14.5px;line-height:1.25;max-width:260px">${esc(d.city)}</div>
      ${d.mapUrl?`<a class="dirLink r" style="--d:${after+1.1}s" href="${d.mapUrl}" target="_blank" rel="noopener">${pinIcon}<span>${U.getDir}</span></a>`:''}`:''}`);
  }
  // closing
  S.push(`
    ${monogram(.72,.1)}
    <div class="serif it r" style="--d:1.2s;font-size:16px;line-height:1.32;margin-top:14px;max-width:270px">${esc(C.blessing)}</div>
    ${divider(1.9)}
    <div class="serif b r" style="--d:2.3s;font-size:17px">${U.compliments}</div>
    <div class="serif it r" style="--d:2.6s;font-size:17px">${esc(C.complimentsFrom)}</div>`);
  // countdown
  const map = C.days[C.days.length-1].mapUrl;
  S.push(`
    <div class="caps r" style="--d:.1s;letter-spacing:.36em">${U.cdLabel}</div>
    <div class="script w" style="--d:.4s;font-size:48px;margin-top:4px">${U.cdTitle}</div>
    <div class="serif it r" style="--d:.9s;font-size:15px">${U.cdDate}</div>
    ${divider(1.1)}
    <div class="cd r" style="--d:1.3s">
      ${['d','h','m','s'].map((k,i)=>`<div class="cdBox"><div class="cdNum" data-u="${k}">--</div><div class="cdUnit">${U.units[i]}</div></div>`).join('')}
    </div>
    <div class="cdMsg" data-u="msg"></div>
    <div class="ctas r" style="--d:1.9s">
      <a class="cta" href="${GCAL}" target="_blank" rel="noopener">${calIcon}<span>${U.calGoogle}</span></a>
      <a class="cta" href="invite.ics" target="_blank" rel="noopener">${calIcon}<span>${U.calApple}</span></a>
      ${map?`<a class="cta" href="${map}" target="_blank" rel="noopener">${pinIcon}<span>${U.directions}</span></a>`:''}
    </div>`);
  return S;
}

const content = $('#content');
let scenes = [], curIdx = -1;
function render(){
  C = lang === 'hi' ? CONFIG_HI : CONFIG; U = UI[lang];
  const S = buildScenes();
  content.innerHTML = S.map((h,i)=>`<div class="scene" id="s${i}"${/class="(wm|mono|ganeshArt)/.test(h)?' data-own="1"':''}>${h}</div>`).join('');
  scenes = [...content.querySelectorAll('.scene')];
  scenes[2].style.justifyContent='flex-start'; scenes[2].style.paddingTop='26px';
  scenes.forEach((sc,i)=>{ if(i === curIdx) sc.classList.add('on'); else sc.classList.add('off'); });
  stage.classList.toggle('hi', lang === 'hi');
  document.documentElement.lang = lang;
  $('#hint').innerHTML = `${U.tapOpen}<small>${U.invited}</small>`;
  $('#replay').textContent = U.replay;
  const lb = $('#langBtn'); lb.textContent = U.langBtn; lb.setAttribute('aria-label', U.langAria);
  try{ updateMusicLabel(); }catch(e){}   // music section may not be ready on first render

}
function tickCountdown(){
  const nums = content.querySelectorAll('[data-u]'); if(!nums.length) return;
  const diff = WEDDING_AT - Date.now();
  const box = content.querySelector('.cd'), msg = content.querySelector('.cdMsg');
  if(diff > 0){
    const t = Math.floor(diff/1000);
    const v = { d: Math.floor(t/86400), h: Math.floor(t%86400/3600), m: Math.floor(t%3600/60), s: t%60 };
    nums.forEach(n=>{ const k = n.dataset.u; if(k in v) n.textContent = String(v[k]).padStart(2,'0'); });
    if(box) box.style.display = ''; if(msg) msg.textContent = '';
  } else {
    if(box) box.style.display = 'none';
    if(msg) msg.textContent = diff > -2*86400000 ? U.cdStarted : U.cdDone;
  }
}
setInterval(tickCountdown, 1000);
render();
const couple = $('#couple');
function setCouple(i){ couple.classList.remove('center','corner');
  if(i===2) couple.classList.add('center'); else if(i>=3) couple.classList.add('corner'); }

/* ---------- petals ---------- */
const petalBox = $('#petals'); let petalTimer = null;
function spawnPetal(){
  const p = document.createElement('div'); const gold = Math.random()<.35;
  p.className = 'petal' + (gold?' g':'');
  const dur = 9 + Math.random()*7;
  p.style.left = (Math.random()*470-10)+'px';
  p.style.setProperty('--dx', (Math.random()*160-80)+'px');
  p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
  p.style.animationDuration = dur+'s';
  const i = document.createElement('i'); i.style.animationDuration = (1.2+Math.random()*1.6)+'s';
  if(!gold) i.style.transform = `scale(${.7+Math.random()*.6})`;
  p.appendChild(i); petalBox.appendChild(p);
  setTimeout(()=>p.remove(), dur*1000+200);
}
function startPetals(){ stopPetals(); for(let k=0;k<6;k++) setTimeout(spawnPetal, k*400); petalTimer = setInterval(spawnPetal, 700); }
function stopPetals(){ clearInterval(petalTimer); petalBox.innerHTML=''; }

/* ---------- parallax tilt ---------- */
const tilt = $('#tilt');
stage.addEventListener('pointermove', e=>{
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
  tilt.style.transform = `rotateY(${x*10}deg) rotateX(${-y*8}deg)`;
});
stage.addEventListener('pointerleave', ()=> tilt.style.transform = '');

/* ---------- timeline ---------- */
let run = 0, started = false;
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const HOLD = [5200, 4200, 6000, 8600, 8200, 8800, 7600, 7000];   // ms each scene stays before the next

function resetScenes(){ scenes.forEach(s=>{ s.classList.remove('on'); s.classList.add('off'); }); }

async function play(){
  const id = ++run;
  const alive = () => id === run;
  stage.classList.add('opening');
  await sleep(500); if(!alive()) return;
  stage.classList.add('opened');
  startPetals();
  setTimeout(()=>{ if(alive()) $('#doors').classList.add('gone'); }, 2400);
  await sleep(1300); if(!alive()) return;
  for(let i=0;i<scenes.length;i++){
    scenes[i].classList.remove('off');
    void scenes[i].offsetWidth;
    scenes[i].classList.add('on');
    curIdx = i;
    setCouple(i);
    stage.classList.toggle('ownWM', scenes[i].dataset.own==='1');
    if(i === scenes.length-1) break;
    await sleep(HOLD[i] + (i===0?1200:0)); if(!alive()) return;
    scenes[i].classList.add('off');
    await sleep(900); if(!alive()) return;
    scenes[i].classList.remove('on');
  }
  await sleep(4200); if(!alive()) return;
  $('#replay').classList.add('show');
}

function reset(){
  run++;
  $('#replay').classList.remove('show');
  stopPetals();
  stage.classList.remove('opening','opened');
  $('#doors').classList.remove('gone');
  curIdx = -1;
  resetScenes();
  setCouple(-1);
  stage.classList.remove('ownWM');
}


/* ---------- music ---------- */
const music = $('#music'), mBtn = $('#musicBtn');
let wantMusic = true, fadeT = null;
function updateMusicLabel(){ const on = !music.paused;
  $('#musicLabel').textContent = U.tapMusic; $('#musicCap').textContent = U.muteCap;
  stage.classList.toggle('musicOn', on); }
function showPlaying(on){ mBtn.classList.toggle('playing', on); mBtn.setAttribute('aria-label', on ? 'Mute music' : 'Play music'); updateMusicLabel(); }
function fadeIn(){ clearInterval(fadeT); let v = 0; music.volume = 0;
  fadeT = setInterval(()=>{ v = Math.min(.85, v + .05); music.volume = v; if(v >= .85) clearInterval(fadeT); }, 120); }
function startMusic(){
  if(!wantMusic) return Promise.resolve(false);
  const p = music.play();
  if(!p) return Promise.resolve(false);
  return p.then(()=>{ mBtn.hidden = false; showPlaying(true); fadeIn(); return true; }).catch(()=>false);
}
$('#musicLabel').addEventListener('click', e=>{ e.stopPropagation(); mBtn.click(); });
$('#langBtn').addEventListener('click', e=>{ e.stopPropagation(); lang = lang === 'en' ? 'hi' : 'en'; render(); });
mBtn.addEventListener('click', e=>{ e.stopPropagation();
  if(music.paused){ wantMusic = true; startMusic(); } else { wantMusic = false; music.pause(); showPlaying(false); } });
stage.addEventListener('pointerdown', ()=>{ if(music.paused && wantMusic) startMusic(); });

/* try to autoplay with sound; if the browser blocks it, wait for "Tap to open" */
function autoOpen(){ setTimeout(()=>{ if(!started){ started = true; play(); } }, 1800); }
startMusic().then(ok=>{
  if(ok || music.error) autoOpen();
  else { stage.classList.add('needTap'); }
});
resetScenes();
stage.addEventListener('click', e=>{
  if(e.target.closest('#replay')) return;
  if(started) return; started = true; play();
});
$('#replay').addEventListener('click', e=>{
  e.stopPropagation(); reset();
  setTimeout(()=>{ started = true; play(); }, 3300);
});
/* allow ?auto via #autoplay for previews */
</script>
</body>
</html>
